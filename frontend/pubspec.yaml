name: fernweh
description: "Walk in. Talk for 20 minutes. Walk out with a published video."
publish_to: "none"
version: 0.1.0+1

# Commit 1 — the skeleton (tracer bullet). The ENTIRE creator flow is clickable on a
# phone with every external service mocked. Runs with ZERO keys (FERNWEH_MOCK defaults
# on). The only real hardware is the camera. Each later commit swaps one mock for one
# real integration — search for `TODO(COMMIT-n)`.

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # routing — status-driven redirects (see lib/core/router.dart)
  go_router: ^14.6.2

  # state + persistence
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3

  # networking — single ApiClient
  dio: ^5.7.0

  # the one real piece of hardware in commit 1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # playback of the (mocked) rendered film + captured clips
  video_player: ^2.9.2

  cupertino_icons: ^1.0.8

  # COMMIT-2 voice will add: web_socket_channel (ElevenLabs conversational WS)
  #   and webview_flutter (React widget fallback). Not needed while voice is mocked.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/sample.mp4
