org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Safety net: never let a build silently auto-download a large SDK component
# (the NDK is ~1GB). All components this app needs are already installed, and the
# NDK is deliberately avoided (see the externalNativeBuild override in
# app/build.gradle.kts). If a build ever legitimately needs a new SDK component it
# will now fail fast with a clear message instead of a silent multi-GB download;
# install it explicitly with `sdkmanager`, or flip this to `true` temporarily.
android.builder.sdkDownload=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
